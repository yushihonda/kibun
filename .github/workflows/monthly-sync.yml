name: Monthly recent movie and drama catalog

on:
  schedule:
    - cron: "0 3 1 * *"
    - cron: "0 3 8 * *"
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Number of pages per source"
        required: false
        default: "250"
      start_page:
        description: "First TMDB page (1-500)"
        required: false
        default: "1"
      prune:
        description: "Remove old low-rated titles after sync"
        type: boolean
        required: false
        default: false
      sources:
        description: "Comma-separated TMDB sources"
        required: false
        default: "discover"
      media_types:
        description: "Comma-separated TMDB media types (movie,tv)"
        required: false
        default: "movie,tv"

permissions:
  contents: read
  issues: write

concurrency:
  group: monthly-catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TMDB_BEARER_TOKEN: ${{ secrets.TMDB_BEARER_TOKEN }}
      EMOTION_AI_MAX_MOVIES: "0"
      EMOTION_AI_MAX_COST_USD: "0"
      SYNC_MAX_PAGES: ${{ inputs.max_pages || '250' }}
      SYNC_START_PAGE: ${{ inputs.start_page || (github.event.schedule == '0 3 8 * *' && '251') || '1' }}
      SYNC_SOURCES: ${{ inputs.sources || 'discover' }}
      SYNC_MEDIA_TYPES: ${{ inputs.media_types || 'movie,tv' }}
      SYNC_CONCURRENCY: "8"
      SYNC_REFRESH_TRACKED: "false"
      SYNC_RUN_SOURCE: "tmdb-monthly-recent-catalog"
      CATALOG_PRUNE_SCOPE: all
      CATALOG_CLASSIC_MIN_RATING: "7"
      CATALOG_CLASSIC_MIN_VOTES: "100"
      CATALOG_CLASSIC_POPULAR_MIN_RATING: "6.5"
      CATALOG_CLASSIC_POPULAR_MIN_VOTES: "150"
      CATALOG_CLASSIC_WIDELY_RATED_MIN_RATING: "6"
      CATALOG_CLASSIC_WIDELY_RATED_MIN_VOTES: "1000"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Close interrupted runs
        run: npm run sync:close-stale
      - name: Set rolling release cutoff
        shell: bash
        run: |
          cutoff="$(( $(date -u +%Y) - 3 ))-01-01"
          echo "SYNC_RELEASE_DATE_FROM=$cutoff" >> "$GITHUB_ENV"
          echo "CATALOG_RELEASE_CUTOFF=$cutoff" >> "$GITHUB_ENV"
      - name: Sync recent movies and dramas with retries
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if timeout 150m npm run sync:catalog; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 30))
            fi
          done
          exit 1
      - name: Remove old low-rated titles except classics and referenced titles
        if: ${{ github.event.schedule == '0 3 8 * *' || inputs.prune == true }}
        env:
          PRUNE_OLD_CATALOG_APPLY: "true"
        run: npm run prune:catalog
      - name: Backfill deterministic emotions
        run: npm run backfill:emotions
      - name: Validate relevance corpus
        run: npm run validate:search-relevance
      - name: Precision regression
        run: npm run test:search-quality
      - name: Data audit
        if: always()
        run: npm run audit:data
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-data-audit-${{ github.run_id }}
          path: .artifacts/data-audit.json
          if-no-files-found: warn
      - name: Open failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Monthly catalog sync failed (${new Date().toISOString().slice(0, 10)})`;
            const body = [
              'The scheduled movie and drama sync did not complete after three attempts.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Check the failed step, the uploaded data audit, Supabase status, and TMDB availability before using workflow_dispatch to retry.'
            ].join('\n');
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'sync-failure'
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'sync-failure',
                color: 'b60205',
                description: 'Automated catalog sync failure'
              });
            }
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'sync-failure'
            });
            if (!existing.data.some(issue => issue.title === title)) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['sync-failure']
              });
            }
