name: Monthly movie sync

on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Maximum pages per source"
        required: false
        default: "20"
      sources:
        description: "Comma-separated TMDB sources"
        required: false
        default: "discover,popular,now_playing,japan,korea"

permissions:
  contents: read
  issues: write

concurrency:
  group: monthly-movie-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TMDB_BEARER_TOKEN: ${{ secrets.TMDB_BEARER_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-4o-mini
      EMOTION_AI_MAX_MOVIES: ${{ vars.EMOTION_AI_MAX_MOVIES || '0' }}
      EMOTION_AI_MAX_COST_USD: ${{ vars.EMOTION_AI_MAX_COST_USD || '0' }}
      SYNC_MAX_PAGES: ${{ inputs.max_pages || '20' }}
      SYNC_SOURCES: ${{ inputs.sources || 'discover,popular,now_playing,japan,korea' }}
      SYNC_CONCURRENCY: "5"
      SYNC_REFRESH_TRACKED: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Close interrupted runs
        run: npm run sync:close-stale
      - name: Sync with retries
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if timeout 100m npm run sync:movies; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 30))
            fi
          done
          exit 1
      - name: Backfill deterministic emotions
        run: npm run backfill:emotions
      - name: Validate relevance corpus
        run: npm run validate:search-relevance
      - name: Precision regression
        run: npm run test:search-quality
      - name: Data audit
        if: always()
        run: npm run audit:data
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movie-data-audit-${{ github.run_id }}
          path: .artifacts/data-audit.json
          if-no-files-found: warn
      - name: Open failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Monthly movie sync failed (${new Date().toISOString().slice(0, 10)})`;
            const body = [
              'The scheduled movie sync did not complete after three attempts.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Check the failed step, the uploaded data audit, Supabase status, and TMDB availability before using workflow_dispatch to retry.'
            ].join('\n');
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'sync-failure'
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'sync-failure',
                color: 'b60205',
                description: 'Automated movie sync failure'
              });
            }
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'sync-failure'
            });
            if (!existing.data.some(issue => issue.title === title)) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['sync-failure']
              });
            }
