name: Daily movie and drama trends

on:
  schedule:
    - cron: "20 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-catalog-trends
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TMDB_BEARER_TOKEN: ${{ secrets.TMDB_BEARER_TOKEN }}
      SYNC_CONCURRENCY: "3"
      SYNC_REFRESH_TRACKED: "false"
      SYNC_RUN_SOURCE: "tmdb-daily-catalog"
      EMOTION_AI_MAX_MOVIES: "0"
      EMOTION_AI_MAX_COST_USD: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sync weekly trends
        env:
          SYNC_SOURCES: trending
          SYNC_MEDIA_TYPES: movie,tv
          SYNC_MAX_PAGES: "3"
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm run sync:catalog; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 20)); fi
          done
          exit 1
      - name: Sync current and upcoming releases
        env:
          SYNC_SOURCES: now_playing,upcoming
          SYNC_MEDIA_TYPES: movie,tv
          SYNC_MAX_PAGES: "5"
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm run sync:catalog; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 20)); fi
          done
          exit 1
